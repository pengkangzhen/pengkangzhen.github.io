baseURL = "https://pengkangzhen.github.io/"
languageCode = "zh-cn"
locale = "zh-cn"
title = "我的博客"
theme = "PaperMod"
paginate = 10

[params]
  env = "production"
  description = "个人技术博客"
  defaultTheme = "auto"
  ShowShareButtons = false
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  comments = false

  [params.homeInfoParams]
    Title = "欢迎来到我的博客"
    Content = "分享技术、思考与生活"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/pengkangzhen"

[[menu.main]]
  identifier = "posts"
  name = "文章"
  url = "/posts/"
  weight = 1

[[menu.main]]
  identifier = "tags"
  name = "标签"
  url = "/tags/"
  weight = 2

[[menu.main]]
  identifier = "archives"
  name = "归档"
  url = "/archives/"
  weight = 3

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    style = "monokai"
    lineNos = true
    codeFences = true
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
