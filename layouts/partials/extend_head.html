{{ if .Params.math }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
  onload="renderMathInElement(document.body, {
    delimiters: [
      {left: '$$', right: '$$', display: true},
      {left: '$', right: '$', display: false}
    ]
  });"></script>
{{ end }}

<style>
:root {
  --main-width: 1024px;
}
html {
  zoom: 0.8;
}
</style>

{{ if .Param "ShowToc" }}
<style>
.toc-float {
  display: none;
}
.toc-float-title {
  font-weight: 700;
  margin-bottom: 0.5rem;
  font-size: 0.9rem;
}
.toc-float ul {
  list-style: none;
  padding-left: 0;
  margin: 0;
}
.toc-float ul ul {
  padding-left: 1rem;
}
.toc-float li {
  margin-bottom: 0.25rem;
}
.toc-float a {
  color: var(--secondary);
  text-decoration: none;
}
.toc-float a:hover {
  text-decoration: underline;
}
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var toc = document.querySelector('.toc-float');
  var main = document.querySelector('.post-single');
  if (!toc || !main) return;
  function positionToc() {
    var rect = main.getBoundingClientRect();
    var leftSpace = rect.left;
    if (leftSpace > 300) {
      toc.style.display = 'block';
      toc.style.position = 'fixed';
      toc.style.top = '80px';
      toc.style.right = '';
      var tocWidth = Math.min(leftSpace - 10, 280);
      toc.style.left = Math.max(10, leftSpace / 2 - tocWidth / 2) + 'px';
      toc.style.width = tocWidth + 'px';
      toc.style.maxHeight = 'calc(100vh - 100px)';
      toc.style.overflowY = 'auto';
      toc.style.fontSize = '0.85rem';
      toc.style.lineHeight = '1.6';
    } else {
      toc.style.display = 'none';
    }
  }
  positionToc();
  window.addEventListener('resize', positionToc);
});
</script>
{{ end }}
